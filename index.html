<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDL Job Finder</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>CDL Job Finder</h1>
    <p>Find trucking jobs that actually fit your life.</p>
  </header>

  <main>
    <h2>Find Your Job</h2>

    <label for="location">Location</label>
    <input id="location" type="text" placeholder="Laurinburg, NC">

    <label for="distance">Distance</label>
    <select id="distance">
      <option>25 miles</option>
      <option>50 miles</option>
      <option selected>100 miles</option>
      <option>150 miles</option>
    </select>

    <label>
      <input type="checkbox">
      Home Daily
    </label>

    <label for="pay">Minimum Weekly Pay</label>
    <input id="pay" type="number" placeholder="$1,300">

    <button type="button">Find CDL Jobs</button>
  </main>
</body>
</html>
